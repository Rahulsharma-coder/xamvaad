services:
  db:
    image: postgres:16-alpine
    container_name: xamvaad-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: xamvaad
      POSTGRES_PASSWORD: xamvaad
      POSTGRES_DB: xamvaad
    ports:
      - "5432:5432"
    volumes:
      - xamvaad-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xamvaad -d xamvaad"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  xamvaad-pgdata:
